# ---------------------------------------------------------------------------
# Business relationships -- post-processing rules
# ---------------------------------------------------------------------------
# These rules are applied AFTER SDV has sampled each table independently.
# They let you encode domain knowledge that SDV cannot infer on its own:
#   * "Leads are ~0.3% of impressions (same day / same channel)"
#   * "Ag equipment demand peaks in spring and fall"
#
# Edit the numbers with your actual funnel conversion rates and seasonality.
# ---------------------------------------------------------------------------

funnel_chains:
  - name: paid_media_funnel
    description: >
      Impressions drive leads drive quotes. Downstream volumes are scaled
      so the total matches driver_volume * sampled_conversion_rate per
      (join_on) group.
    driver_table: bronze_impressions
    driver_metric_column: impression_count
    downstream:
      - table: bronze_leads
        metric_column: lead_count
        conversion_rate:
          mean: 0.003          # ~0.3% of impressions -> leads
          std: 0.001
        join_on: [date, channel]
      - table: bronze_quotes
        metric_column: quote_count
        conversion_rate:
          mean: 0.15           # ~15% of leads -> quotes
          std: 0.05
        join_on: [date, channel]

# ---------------------------------------------------------------------------
# Seasonality: multiply metric columns by a per-month coefficient.
# ---------------------------------------------------------------------------
seasonality:
  - name: ag_equipment_cycle
    description: >
      Ag equipment demand peaks in spring (prep) and early fall (harvest),
      troughs in mid-winter. Multipliers are applied to the configured
      metric column for each table based on the month of its date column.
    tables: [bronze_impressions, bronze_leads, bronze_quotes]
    # Column that each table uses to derive the month. Defaults to `date` if
    # omitted. Add entries here when a table uses a different column name.
    date_column: date
    date_columns_per_table: {}
    metric_columns_per_table:
      bronze_impressions: impression_count
      bronze_leads: lead_count
      bronze_quotes: quote_count
    multipliers_by_month:
      "01": 0.7
      "02": 0.8
      "03": 1.3
      "04": 1.4
      "05": 1.3
      "06": 1.0
      "07": 0.9
      "08": 1.0
      "09": 1.2
      "10": 1.3
      "11": 0.9
      "12": 0.7
